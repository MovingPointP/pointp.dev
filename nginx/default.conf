# Cloudflare は Cache-Control に従ってキャッシュする。付けなかったものはキャッシュされない。
# 方針は katarina-infra の docs/cloudflare/cache.md を参照。
server {
    # 1024 番未満は root の権限が必要なため 8080 番
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML：Cloudflare は 5 分キャッシュし、ブラウザは毎回確認する（更新が残らないように）
    # always を付けないので、404 などのエラーには付かない（＝キャッシュされない）
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, s-maxage=300";
    }

    location ~* \.(css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
