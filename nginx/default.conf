# Cloudflare は Cache-Control に従ってキャッシュする。付けなかったものはキャッシュされない。
# 方針は katarina-infra の docs/cloudflare/cache.md を参照。
server {
    # 1024 番未満は root の権限が必要なため 8080 番
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # フォルダへのリダイレクトに :8080 を付けない（Location を /pages/ のような相対にする）
    absolute_redirect off;
    # エラーページに Nginx のバージョンを出さない
    server_tokens off;

    # location が決まる前に返す応答（下の 405）と、add_header のない location 用
    include /etc/nginx/conf.d/security-headers.inc;

    # 静的なページなので、GET と HEAD 以外は受け付けない
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # 404 は自前のページを出す（Nginx の標準のページを出さない）
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 隠しファイル（/. で始まるパス）は出さない。/.well-known/ だけは例外。
    # 正規表現の location は書いた順に評価されるので、ほかの正規表現より前に書く
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # HTML：Cloudflare は 5 分キャッシュし、ブラウザは毎回確認する（更新が残らないように）
    # always を付けないので、404 などのエラーには付かない（＝キャッシュされない）
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, s-maxage=300";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # JS・CSS・書体：ファイル名に中身のハッシュが入っていて中身が変わらないので 1 年
    location ~* \.(css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 画像・アイコン：1 日（OGP 画像は作り直したらファイル名を変える）
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
