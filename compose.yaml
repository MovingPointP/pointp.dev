services:
  web:
    # root を使わずに動く公式の Nginx。8080 番で待ち受ける。
    # 版と digest を固定し、確かめた版だけを動かす（更新は Dependabot の PR）
    image: nginx/nginx-unprivileged:1.31.9-alpine@sha256:60214a103e6f38e953ff957f34b1f2e97a9db801ab2df3821da955d0fe6cadd6
    container_name: pointp-dev-web
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # ファイル単体ではなくフォルダでマウントする（git pull で差し替えたファイルが反映されない問題を避ける）
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - proxy
    # 乗っ取られたときにできることを減らす
    read_only: true
    tmpfs:
      # このイメージは一時ファイルと pid を /tmp に置く
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # アクセスログは残すが、ディスクがあふれないよう、IP を含むかもしれないログを長く残さないよう上限を付ける
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
