services:
  web:
    # root を使わずに動く公式の Nginx。8080 番で待ち受ける
    image: nginxinc/nginx-unprivileged:alpine
    container_name: pointp-dev-web
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # ファイル単体ではなくフォルダでマウントする（git pull で差し替えたファイルが反映されない問題を避ける）
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - proxy
    # 乗っ取られたときにできることを減らす
    read_only: true
    tmpfs:
      # このイメージは一時ファイルと pid を /tmp に置く
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
