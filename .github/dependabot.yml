version: 2
updates:
  # イメージは版と digest で固定し、更新は PR で知らせる（確かめてからマージする）
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      # セキュリティの修正に早く気づくため毎日
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"

  # ビルドに使う esbuild（開発時だけの依存）。脆弱性の修正と新しい版を PR で知らせる
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
