<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fdfdfc">
<meta name="description" content="Point P never stops. Steer it with a protractor joystick and draw a single line on graph paper.">
<link rel="canonical" href="https://pointp.dev/">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="pointp.dev">
<meta property="og:title" content="pointp.dev">
<meta property="og:description" content="Point P never stops. Steer it with a protractor joystick and draw a single line on graph paper.">
<meta property="og:url" content="https://pointp.dev/">

<body>
<h1 class="visually-hidden">I'm pointp, always moving</h1>
<p class="visually-hidden">A point P that never stops draws a single line on graph paper. Steer it by dragging the protractor joystick at the bottom of the screen with a mouse or a finger. There is no keyboard control.</p>

<noscript><img class="noscript-intro" src="assets/intro.svg" alt="I'm pointp, always moving"></noscript>

<canvas class="world" aria-hidden="true"></canvas>
<div class="flash" aria-hidden="true"></div>

<div class="minimap ui" aria-hidden="true">
  <canvas class="minimap-lines"></canvas>
  <canvas class="minimap-overlay"></canvas>
</div>

<svg class="joystick ui" viewBox="0 0 200 200" role="img" aria-label="Joystick: drag to steer point P">
  <defs>
    <filter id="knob-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#21201c" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle class="plate" cx="100" cy="100" r="64" fill="#fdfdfc" stroke="#cfceca"/>
  <g class="ticks"></g>
  <path d="M100 50V150M50 100H150" stroke="#a9daed" stroke-width="1.5"/>
  <g class="knob">
    <circle class="knob-fill" cx="100" cy="100" r="22" fill="#1f2d5c" filter="url(#knob-shadow)"/>
    <circle cx="100" cy="100" r="14" fill="none" stroke="#fdfdfc" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>
</body>
